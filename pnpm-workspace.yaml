# Ajustes de pnpm, la herramienta que instala las piezas necesarias del proyecto.
pmOnFail: ignore

# Nombres de herramientas que pnpm debe tratar de forma especial.
minimumReleaseAgeExclude:
  - '@next/*'
  - next
  - '@supabase/auth-js@2.119.0'
  - '@supabase/functions-js@2.119.0'
  - '@supabase/postgrest-js@2.119.0'
  - '@supabase/realtime-js@2.119.0'
  - '@supabase/storage-js@2.119.0'
  - '@supabase/supabase-js@2.119.0'
